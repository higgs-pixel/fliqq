name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: core

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --release -- -D warnings
      - name: test
        run: cargo test --release
      - name: build CLI
        run: cargo build --release -p fliq_cli
      - name: smoke benchmark (256 MiB)
        run: cargo run --release -p fliq_cli -- bench --size 256M
      - uses: actions/upload-artifact@v5
        with:
          name: fliq_cli-${{ matrix.os }}
          path: |
            core/target/release/fliq_cli
            core/target/release/fliq_cli.exe
          if-no-files-found: ignore

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml

  app-windows:
    name: Windows app (Flutter) + installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install FRB codegen
        run: cargo install flutter_rust_bridge_codegen@2.11.1 cargo-expand --locked
      - name: Add Windows runner (generated by Flutter, then patched)
        run: |
          flutter create --platforms=windows --project-name fliq --org app.fliq .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }
          python tools/patch_windows_runner.py
      - name: Regenerate bridge code with the real toolchain
        run: flutter_rust_bridge_codegen generate
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests (token lint, contrast, formatting)
        run: flutter test
      - name: Build
        run: flutter build windows --release -v
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-failure-logs
          path: |
            app/build/
          if-no-files-found: ignore
      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=0.2.0 windows_installer\fliq.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        with:
          name: fliq-windows
          path: |
            app/build/installer/*.exe
            app/build/windows/x64/runner/Release/
